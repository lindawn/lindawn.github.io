<div class="ad-block-alert">
  <div
    id="ad-block-absent"
    class="alert alert-info alert-dismissible fade show animated fadeIn">
    It seems you're not using an adblocker. Consider installing an adblock
    browser extension for a better internet exploration experience.
    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div
    id="ad-block-present"
    class="alert alert-success alert-dismissible fade show auto-close">
    AdBlock detected. Carry on. 
    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
</div>
